services:
  mongodb:
    image: mongo:6
    container_name: code_runner_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - code_runner_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
    container_name: code_runner_service
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - TIMEOUT_MS=5000
    networks:
      - code_runner_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code_runner_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/compiler
      - RUNNER_SERVICE_URL=http://runner:5000
      - JWT_SECRET=devops_assignment_jwt_secret_key_123
    depends_on:
      mongodb:
        condition: service_healthy
      runner:
        condition: service_healthy
    networks:
      - code_runner_network

networks:
  code_runner_network:
    driver: bridge

volumes:
  mongodb_data:
